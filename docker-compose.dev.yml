# Uso: na raiz do repositório, `docker compose -f docker-compose.dev.yml up -d --build`
# Serviços: db (PostgreSQL), backend (runserver), frontend (ng serve). Código montado em volumes.
# Superusuário: defina DJANGO_SUPERUSER_* em backend/.env; o entrypoint executa create_admin_user.

name: app-templates-dev

services:
  db:
    image: postgres:16-alpine
    container_name: app_db_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_pass}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_backend_dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-dev

  frontend:
    image: node:20-alpine
    container_name: app_frontend_dev
    working_dir: /app
    command: sh -c "npm ci && npm run start -- --host 0.0.0.0"
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - app-dev

networks:
  app-dev:
    driver: bridge

volumes:
  postgres_data_dev:
