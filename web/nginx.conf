# SPA Angular: fallback para index.html (roteamento no cliente) e cache de assets.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets com hash no nome (ng build --configuration production)
    location ~* \.(js|css|woff2?|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
