<!-- Header -->
<header class="h-16 bg-panel-light dark:bg-panel-dark border-b border-border-light dark:border-border-dark flex items-center justify-between px-4 transition-colors duration-300">

  <!-- Brand and navigation trigger -->
  <div class="flex items-center gap-4">

    <!-- Menu button -->
    <button
      (click)="toggleMenu()"
      class="btn-icon p-2 rounded-md text-muted focus:outline-none cursor-pointer!"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Divider -->
    <div class="h-6 w-px bg-border-light dark:bg-border-dark"></div>

    <!-- Brand -->
    <span class="text-xl font-semibold text-primary-600 tracking-tight">
      DjangoAdmin<span class="text-heading">Template</span>
    </span>

  </div>

  <!-- Right section -->
  <div class="flex items-center">

    <!-- Theme toggle -->
    <button
      (click)="themeService.toggleTheme()"
      class="btn-icon p-2 rounded-lg text-muted cursor-pointer! focus:outline-none"
      title="Alternar Tema"
    >
      @if (themeService.darkMode()) {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707.707M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      } @else {
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      }
    </button>

    <!-- Divider -->
    <div class="mx-3 h-6 w-px bg-border-light dark:bg-border-dark"></div>

    <!-- User menu trigger -->
    <button
      [matMenuTriggerFor]="userMenu"
      class="flex items-center gap-2 p-1 rounded-lg focus:outline-none cursor-pointer! group"
    >

      <div class="w-9 h-9 rounded-full bg-primary-600 flex items-center justify-center text-white text-sm font-bold shadow-sm">
        {{ user()?.first_name?.charAt(0) || 'U' }}{{ user()?.last_name?.charAt(0) || '' }}
      </div>

      <svg
        class="w-4 h-4 icon-muted group-hover:text-primary-600 transition-colors"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>

    </button>

    <!-- Menu -->
    <mat-menu
      #userMenu="matMenu"
      xPosition="before"
      class="mt-2! rounded-xl! border! border-border-light! dark:border-border-dark! shadow-lg! bg-panel-light! dark:bg-panel-dark! [&_.mat-mdc-menu-content]:p-0!"
    >

      <!-- User info -->
      @if (user()?.first_name) {
        <div class="px-4 py-3 border-b border-border-light dark:border-border-dark">
          <p class="text-sm font-medium text-muted leading-none mb-1">
            {{ user()?.first_name }} {{ user()?.last_name }}
          </p>

          <p class="text-xs text-caption-muted truncate font-medium">
            {{ user()?.email }}
          </p>
        </div>
      }

      <!-- Menu items -->
      <div class="p-1">

        <button
          mat-menu-item
          routerLink="/profile"
          class="menu-item-hover text-sm! transition-colors group cursor-pointer!"
        >
          <div class="flex items-center gap-3">
            <svg class="w-4 h-4 icon-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <span class="text-muted">Meu Perfil</span>
          </div>
        </button>

        <!-- Divider -->
        <div class="my-1 border-t border-border-light dark:border-border-dark"></div>

        <button
          mat-menu-item
          (click)="handleLogout()"
          class="text-sm! font-medium group cursor-pointer!"
        >
          <div class="flex items-center gap-3">
            <svg class="w-4 h-4 icon-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            <span class="text-danger text-danger-hover">Sair do Sistema</span>
          </div>
        </button>

      </div>

    </mat-menu>

  </div>

</header>
