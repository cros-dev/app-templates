<!-- Sidebar -->
<nav class="flex flex-col h-full overflow-y-auto bg-panel-light dark:bg-panel-dark transition-colors duration-300">

  <!-- Grupos de navegação: cada grupo → itens → divider (exceto após o último) -->
  @for (group of menuGroups; track $index) {
    <div class="px-3 space-y-1 pb-4" [class.pt-6]="$index === 0" [class.pt-4]="$index > 0">
      @for (item of group; track item.label) {
        @if (item.disabled) {
          <button
            type="button"
            class="nav-link flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-muted transition-all duration-200 group cursor-pointer! w-full text-left"
          >
            <svg
              class="w-5 h-5 icon-muted transition-colors"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.iconPath" />
            </svg>
            <span>{{ item.label }}</span>
          </button>
        } @else {
          <a
            [routerLink]="item.route"
            routerLinkActive="nav-item-active"
            [routerLinkActiveOptions]="{ exact: true }"
            #rla="routerLinkActive"
            class="nav-link relative flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-muted transition-all duration-200 group cursor-pointer! w-full text-left"
          >
            @if (rla.isActive) {
              <span class="nav-item-active-bar"></span>
            }
            <svg
              class="w-5 h-5 icon-muted transition-colors"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.iconPath" />
            </svg>
            <span>{{ item.label }}</span>
          </a>
        }
      }
    </div>
    @if ($index < menuGroups.length - 1) {
      <div class="mx-4 border-t border-border-light dark:border-border-dark"></div>
    }
  }

  <!-- Spacer: empurra o bloco abaixo para o rodapé -->
  <div class="flex-1 min-h-0"></div>

  <!-- Divider acima de Sistema Online -->
  <div class="mx-4 mb-4 border-t border-border-light dark:border-border-dark"></div>

  <!-- System status -->
  <div class="px-6 pb-6">

    <div class="status-card">

      <div class="status-dot-online"></div>

      <div class="flex-1 min-w-0">

        <p class="text-[10px] font-semibold text-caption-muted uppercase leading-none mb-1">
          Sistema Online
        </p>

        <p class="text-[9px] text-caption-muted font-mono truncate">
          v1.0.0-stable
        </p>

      </div>

    </div>

  </div>

</nav>
