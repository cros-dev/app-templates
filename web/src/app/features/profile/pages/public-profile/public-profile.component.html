<div class="space-y-8 transition-colors duration-300">

  <section>
    <!-- Form -->
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="max-w-2xl space-y-6">

      <!-- Alerts -->
      @if (successMessage() || errorMessage()) {
        <div class="animate-in fade-in slide-in-from-top-2 duration-300">
          @if (successMessage()) {
            <div class="alert-success">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
              <span>Alterações salvas com sucesso.</span>
            </div>
          }
          @if (errorMessage()) {
            <div class="alert-error">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <span>{{ errorMessage() }}</span>
            </div>
          }
        </div>
      }

      <!-- Form Fields -->
      <div class="grid grid-cols-1 gap-5">

        <div>
          <label class="form-label mb-1.5">Nome de utilizador</label>
          <input
            type="text"
            formControlName="username"
            class="input-base bg-surface-hover-light dark:bg-surface-hover-dark opacity-60 cursor-not-allowed!"
          >
          <p class="mt-1.5 text-xs text-caption-muted">
            O seu identificador único. Não pode ser alterado por utilizadores padrão.
          </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="form-label mb-1.5">Nome</label>
            <input type="text" formControlName="first_name" class="input-base">
          </div>
          <div>
            <label class="form-label mb-1.5">Sobrenome</label>
            <input type="text" formControlName="last_name" class="input-base">
          </div>
        </div>

        <div>
          <label class="form-label mb-1.5">E-mail</label>
          <input type="email" formControlName="email" class="input-base">
          <p class="mt-1.5 text-xs text-caption-muted">
            Utilizado para notificações e recuperação de conta.
          </p>
        </div>
      </div>

      <!-- Divider -->
      <div class="border-t border-border-light dark:border-border-dark pt-6"></div>

      <!-- Actions -->
      <div class="flex justify-end">
        <button
          type="submit"
          [disabled]="profileForm.invalid || isLoading()"
          class="btn-primary min-w-40"
        >
          @if (isLoading()) {
            <svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-white inline" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Salvando...
          } @else {
            Atualizar perfil
          }
        </button>
      </div>

    </form>
  </section>

</div>
