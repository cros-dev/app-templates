<div class="min-h-screen flex flex-col justify-center items-center py-12 sm:px-6 lg:px-8 bg-surface-light dark:bg-surface-dark transition-colors duration-300">

  <!-- Header -->
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <h2 class="mt-6 text-3xl font-extrabold leading-tight tracking-tight text-gray-900 dark:text-white">
      Aceda à sua conta
    </h2>

    <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
      Utilize as suas credenciais do DjangoAdmin
    </p>
  </div>

  <!-- Card -->
  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-panel-light dark:bg-panel-dark py-8 px-4 shadow-xl border border-border-light dark:border-border-dark sm:rounded-xl sm:px-10 transition-colors">

      <!-- Error message -->
      @if (errorMessage()) {
        <div class="mb-4 p-3 rounded-lg border text-sm
                    bg-red-50 border-red-200 text-red-600
                    dark:bg-red-900/20 dark:border-red-800/50 dark:text-red-400">
          {{ errorMessage() }}
        </div>
      }

      <!-- Form -->
      <form
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
        class="space-y-6"
      >

        <!-- Username -->
        <div>
          <label
            for="username"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300"
          >
            Utilizador
          </label>

          <div class="mt-1">
            <input
              id="username"
              type="text"
              autocomplete="username"
              required
              formControlName="username"
              class="input-base"
              [class.border-red-500]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid"
            >
          </div>
        </div>

        <!-- Password -->
        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300"
          >
            Palavra-passe
          </label>

          <div class="mt-1">
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
              formControlName="password"
              class="input-base"
              [class.border-red-500]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
            >
          </div>
        </div>

        <!-- Submit -->
        <div>
          <button
            type="submit"
            [disabled]="loginForm.invalid || isLoading()"
            class="btn-primary w-full"
          >

            @if (isLoading()) {

              <svg
                class="animate-spin -ml-1 mr-3 h-5 w-5 text-white"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>

                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373
                  0 0 5.373 0 12h4zm2
                  5.291A7.962 7.962
                  0 014 12H0c0 3.042
                  1.135 5.824 3
                  7.938l3-2.647z"
                ></path>

              </svg>

              A processar...

            } @else {

              Entrar

            }

          </button>
        </div>

      </form>

    </div>
  </div>
</div>
