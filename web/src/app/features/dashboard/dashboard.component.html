<!-- Header -->
<div class="mb-6">
  <h1 class="text-2xl font-semibold text-heading">Dashboard</h1>
  <p class="text-muted text-sm mt-1">Bem-vindo ao painel de controle.</p>
</div>

<!-- Toast Test -->
<div class="bg-panel-light dark:bg-panel-dark rounded-xl border border-border-light dark:border-border-dark p-6">
  <h2 class="text-lg font-semibold text-heading mb-4">Testar Toast</h2>
  <div class="flex flex-wrap gap-3">
    <button
      (click)="showSuccess()"
      class="px-4 py-2 text-sm font-medium rounded-lg bg-green-600 text-white hover:bg-green-700 transition-colors cursor-pointer"
    >
      Success
    </button>
    <button
      (click)="showError()"
      class="px-4 py-2 text-sm font-medium rounded-lg bg-red-600 text-white hover:bg-red-700 transition-colors cursor-pointer"
    >
      Error
    </button>
    <button
      (click)="showInfo()"
      class="px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition-colors cursor-pointer"
    >
      Info
    </button>
    <button
      (click)="showWarning()"
      class="px-4 py-2 text-sm font-medium rounded-lg bg-yellow-500 text-white hover:bg-yellow-600 transition-colors cursor-pointer"
    >
      Warning
    </button>
  </div>
</div>
